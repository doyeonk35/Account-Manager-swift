name: TVAccountManager
options:
  bundleIdPrefix: com.tv
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  developmentLanguage: en
  knownRegions: [en, ko, Base]
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "15"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: F64BRNFSBB
    Release:
      # 빌드는 unsigned — 배포 서명은 scripts/release.sh에서 회사 Developer ID로 재서명
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
  # CLI 선택기·진행 표시. 0.x라 minorVersion으로 묶는다 (0.58에서 깨지는 변경이 와도 안 끌려온다).
  Noora:
    url: https://github.com/tuist/Noora
    minorVersion: "0.57.5"
targets:
  TVAccountManager:
    type: application
    platform: macOS
    sources:
      - TVAccountManager
    dependencies:
      - package: Sparkle
      # 선택기 UI 헬퍼. 샌드박스 밖이어야 터미널 raw 모드를 쓸 수 있어 별도 바이너리로 둔다.
      - target: tvlogin
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TVAccountManager/TVAccountManager.entitlements
        INFOPLIST_FILE: TVAccountManager/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tv.account-manager
        PRODUCT_NAME: TVAccountManager
        PRODUCT_MODULE_NAME: TVAccountManager
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tv.account-manager.debug
          PRODUCT_NAME: TVAccountManager-Debug
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: F64BRNFSBB
  tvlogin:
    type: tool
    platform: macOS
    sources:
      - TVAccountManagerCLI
    dependencies:
      - package: Noora
    settings:
      base:
        PRODUCT_NAME: tvlogin
        PRODUCT_BUNDLE_IDENTIFIER: com.tv.account-manager.cli
        # 엔타이틀먼트 없음 — 샌드박스되면 tcsetattr가 EPERM이라 선택기를 띄울 수 없다.
        # release.sh의 `codesign --deep`이 hardened runtime으로 함께 서명한다.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: F64BRNFSBB

  TVAccountManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TVAccountManagerTests
    dependencies:
      - target: TVAccountManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tv.account-manager.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TVAccountManager-Debug.app/Contents/MacOS/TVAccountManager-Debug"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TVAccountManager.app/Contents/MacOS/TVAccountManager"
